name: BIMA diagnostic extract
on:
  push:
    branches: [ai-client-assistant-card]
    paths: ['.github/workflows/bima-diagnostic.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print relevant BIMA snippets
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          needles = ['id="bimaDiscovery"','data-bima-service','serviceApiKey','Penyediaan SDM CS','CS Staffing']
          for needle in needles:
              print('\n===== '+needle+' =====')
              start=0
              count=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  count += 1
                  a=max(0,i-1800); b=min(len(s),i+3600)
                  print(s[a:b])
                  start=i+len(needle)
                  if count>=10: break
              if count==0: print('NOT FOUND')
