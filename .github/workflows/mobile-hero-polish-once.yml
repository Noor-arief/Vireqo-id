name: Mobile Hero Polish Once

on:
  push:
    branches:
      - mobile-hero-polish

permissions:
  contents: write

jobs:
  patch-mobile-hero:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-hero-polish

      - name: Apply isolated mobile-only hero CSS
        env:
          MOBILE_HERO_CSS_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<style id="mobile-hero-polish">'
          if marker in html:
              raise SystemExit('Mobile hero polish already present; refusing duplicate insertion.')
          css = base64.b64decode(os.environ['MOBILE_HERO_CSS_B64']).decode('utf-8')
          if '</head>' not in html:
              raise SystemExit('Could not find </head>; refusing to modify index.html.')
          path.write_text(html.replace('</head>', css + '</head>', 1), encoding='utf-8')
          PY

      - name: Verify scope
        run: |
          set -e
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q 'id="mobile-hero-polish"' index.html
          git diff --stat -- index.html

      - name: Commit isolated patch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish mobile hero spacing only [mobile-hero-patched]"
          git push origin HEAD:mobile-hero-polish
