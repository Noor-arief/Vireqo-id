name: Phase 1 Production Acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run production acceptance
        env:
          TARGET_URL: https://vireqo.id
        run: |
          cat > phase1-acceptance.js <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const d=await browser.newPage({viewport:{width:1440,height:900}});
            await d.goto(process.env.TARGET_URL,{waitUntil:'networkidle',timeout:60000});
            const h=d.locator('.hero h1'), v=d.locator('.hero-visual.issue123-approved-hero img');
            assert(await h.isVisible(),'desktop hero heading hidden');
            assert(await v.isVisible(),'desktop approved hero image hidden');
            let b=await v.boundingBox(); assert(b&&b.width>400,'desktop approved hero image too small');
            const l=d.locator('#langToggle'); let a=(await h.innerText()).trim();
            await l.click(); await d.waitForTimeout(250);
            assert.notStrictEqual((await h.innerText()).trim(),a,'desktop language did not change');
            assert.strictEqual(await d.locator('html').getAttribute('lang'),'en','html lang not en');
            await l.click();
            const f=d.locator('#bimaFab'); assert(await f.isVisible(),'desktop Ask BIMA hidden');
            await f.click(); await d.waitForTimeout(300); assert(await d.locator('#bimaPanel').isVisible(),'desktop BIMA panel did not open');
            await d.locator('#bimaClose').click();
            const m=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            await m.goto(process.env.TARGET_URL,{waitUntil:'networkidle',timeout:60000});
            const mh=m.locator('.hero h1'), mv=m.locator('.hero-visual.issue123-approved-hero img');
            assert(await mh.isVisible(),'mobile hero heading hidden'); assert(await mv.isVisible(),'mobile approved hero image hidden');
            b=await mv.boundingBox(); assert(b&&b.width>250&&b.width<=390,'mobile approved hero image sizing failed');
            const hb=m.locator('#hamburgerBtn'); assert(await hb.isVisible(),'hamburger hidden');
            await hb.click(); await m.waitForTimeout(250);
            assert.strictEqual(await hb.getAttribute('aria-expanded'),'true','hamburger aria state failed');
            assert(await m.locator('#mobileMenu').isVisible(),'mobile menu did not open');
            const ml=m.locator('#langToggleMobile'); a=(await mh.innerText()).trim();
            await ml.click(); await m.waitForTimeout(250); assert.notStrictEqual((await mh.innerText()).trim(),a,'mobile language did not change');
            await hb.click();
            // Reset language to ID before Phase 7 product assertions; the hero test above intentionally switched to EN.
            if((await m.locator('html').getAttribute('lang'))==='en'){
              await hb.click(); await m.waitForTimeout(150);
              await m.locator('#langToggleMobile').click(); await m.waitForTimeout(250);
              await hb.click(); await m.waitForTimeout(150);
            }
            assert.strictEqual(await m.locator('html').getAttribute('lang'),'id','mobile product QA did not reset to ID');
            // Phase 7 mobile product-section regression: real Chromium viewport 390x844.
            await m.locator('#layanan').scrollIntoViewIfNeeded();
            const cards=m.locator('#layanan .svc');
            assert.strictEqual(await cards.count(),4,'mobile product card count must be 4');
            const boxes=[];
            for(let i=0;i<4;i++){
              const card=cards.nth(i); assert(await card.isVisible(),`mobile product card ${i+1} hidden`);
              const box=await card.boundingBox(); assert(box,'mobile product card missing box');
              assert(box.x>=0 && box.x+box.width<=390,'mobile product card overflows viewport');
              boxes.push(box);
            }
            for(let i=1;i<boxes.length;i++) assert(boxes[i].y>boxes[i-1].y+boxes[i-1].height-2,'mobile product cards are not single-column');
            const idText=await m.locator('#layanan').innerText();
            for(const price of ['Rp799.000','Rp2.250.000','Rp2.790.000','Rp1.500.000']) assert(idText.includes(price),`mobile ID missing ${price}`);
            for(const cta of ['Mulai Website Anda','Mulai dengan AI Assistant','Pilih Paket Website + AI','Mulai Dashboard CS']) assert(idText.includes(cta),`mobile ID missing CTA: ${cta}`);
            const mobileMenuBtn=m.locator('#hamburgerBtn'); await mobileMenuBtn.click(); await m.waitForTimeout(150);
            await m.locator('#langToggleMobile').click(); await m.waitForTimeout(250);
            const enText=await m.locator('#layanan').innerText();
            for(const price of ['Rp799,000','Rp2,250,000','Rp2,790,000','Rp1,500,000']) assert(enText.includes(price),`mobile EN missing ${price}`);
            for(const cta of ['Start Your Website','Start with AI Assistant','Choose Website + AI Package','Start Your CS Dashboard']) assert(enText.includes(cta),`mobile EN missing CTA: ${cta}`);
            await mobileMenuBtn.click(); await m.waitForTimeout(150);
            const productCta=m.locator('#layanan .svc-cta').first(); assert(await productCta.isVisible(),'mobile product CTA hidden');
            await productCta.click(); await m.waitForTimeout(300);
            assert(await m.locator('#bimaPanel').isVisible(),'mobile product CTA did not open BIMA');
            await m.locator('#bimaClose').click();
            const mf=m.locator('#bimaFab'); assert(await mf.isVisible(),'mobile Ask BIMA hidden');
            await mf.click(); await m.waitForTimeout(300); assert(await m.locator('#bimaPanel').isVisible(),'mobile BIMA panel did not open');
            console.log('PASS: mobile hero + ID/EN + hamburger + product cards + product CTA + Ask BIMA');
            // Phase 8.7/8.8 mobile + reduced-motion guardrails.
            const overflow=await m.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            assert(overflow.sw<=overflow.cw+1,`mobile full-page horizontal overflow: ${overflow.sw} > ${overflow.cw}`);
            await m.locator('#bimaClose').click(); await m.waitForTimeout(150);
            await m.locator('#layanan').scrollIntoViewIfNeeded(); await m.waitForTimeout(900);
            const nudge=m.locator('#bimaNudge');
            if(await nudge.isVisible()){const nb=await nudge.boundingBox();assert(nb&&nb.x>=0&&nb.x+nb.width<=390,'mobile BIMA helper overflows viewport');}
            const rm=await browser.newPage({viewport:{width:390,height:844},isMobile:true,reducedMotion:'reduce'});
            await rm.goto(process.env.TARGET_URL,{waitUntil:'networkidle',timeout:60000});
            const reduced=await rm.evaluate(()=>({
              scrollBehavior:getComputedStyle(document.documentElement).scrollBehavior,
              revealTransition:getComputedStyle(document.querySelector('.reveal')).transitionDuration,
              fabAnimation:getComputedStyle(document.querySelector('#bimaFab')).animationName
            }));
            assert(reduced.scrollBehavior==='auto','reduced-motion smooth scroll still enabled');
            assert(reduced.revealTransition==='0s'||reduced.revealTransition==='0.001ms'||reduced.revealTransition.includes('0.00001'),'reduced-motion reveal transition still active');
            assert(reduced.fabAnimation==='none','reduced-motion BIMA FAB animation still active');
            await rm.close();
            console.log('PASS: Phase 8 mobile overflow + BIMA helper bounds + reduced-motion guardrails');
            await browser.close();
          })().catch(e=>{console.error(`::error title=Production acceptance failed::${String(e && e.stack || e).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A')}`);console.error(e);process.exit(1)});
          JS
          node phase1-acceptance.js
