name: Phase 1 Production Acceptance
on:
  push:
    branches: [phase1-acceptance-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run production acceptance
        env:
          TARGET_URL: https://vireqo.id
        run: |
          cat > /tmp/phase1.js <<'JS'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const desktop=await browser.newPage({viewport:{width:1440,height:900}});
            await desktop.goto(process.env.TARGET_URL,{waitUntil:'networkidle',timeout:60000});
            await desktop.locator('.hero').waitFor({state:'visible'});
            const h1=desktop.locator('.hero h1');
            assert(await h1.isVisible(),'desktop hero h1 not visible');
            const visual=desktop.locator('.hero-visual.issue123-approved-hero img');
            assert(await visual.isVisible(),'approved desktop hero artwork not visible');
            const dbox=await visual.boundingBox();
            assert(dbox && dbox.width>400,'desktop hero artwork too narrow');

            const lang=desktop.locator('#langToggle');
            assert(await lang.isVisible(),'desktop language toggle missing');
            const before=(await h1.innerText()).trim();
            await lang.click();
            await desktop.waitForTimeout(250);
            const after=(await h1.innerText()).trim();
            assert.notStrictEqual(after,before,'ID/EN toggle did not change hero copy');
            assert.strictEqual(await desktop.locator('html').getAttribute('lang'),'en','html lang did not switch to en');
            await lang.click();

            const fab=desktop.locator('#bimaFab');
            assert(await fab.isVisible(),'Ask BIMA FAB missing');
            await fab.click();
            await desktop.waitForTimeout(300);
            const panel=desktop.locator('#bimaPanel');
            assert(await panel.isVisible(),'Ask BIMA panel did not open');
            await desktop.locator('#bimaClose').click();

            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            await mobile.goto(process.env.TARGET_URL,{waitUntil:'networkidle',timeout:60000});
            const mh1=mobile.locator('.hero h1');
            assert(await mh1.isVisible(),'mobile hero h1 not visible');
            const mvisual=mobile.locator('.hero-visual.issue123-approved-hero img');
            assert(await mvisual.isVisible(),'approved mobile hero artwork not visible');
            const mbox=await mvisual.boundingBox();
            assert(mbox && mbox.width>250 && mbox.width<=390,'mobile hero artwork sizing invalid');
            const hamburger=mobile.locator('#hamburgerBtn');
            assert(await hamburger.isVisible(),'mobile hamburger missing');
            await hamburger.click();
            await mobile.waitForTimeout(250);
            assert.strictEqual(await hamburger.getAttribute('aria-expanded'),'true','hamburger did not open');
            assert(await mobile.locator('#mobileMenu').isVisible(),'mobile menu not visible after open');
            const mlang=mobile.locator('#langToggleMobile');
            assert(await mlang.isVisible(),'mobile language toggle missing');
            const mbefore=(await mh1.innerText()).trim();
            await mlang.click();
            await mobile.waitForTimeout(250);
            const mafter=(await mh1.innerText()).trim();
            assert.notStrictEqual(mafter,mbefore,'mobile ID/EN toggle did not change hero copy');
            const mfab=mobile.locator('#bimaFab');
            assert(await mfab.isVisible(),'mobile Ask BIMA FAB missing');
            await mobile.locator('#hamburgerBtn').click();
            await mfab.click();
            await mobile.waitForTimeout(300);
            assert(await mobile.locator('#bimaPanel').isVisible(),'mobile Ask BIMA panel did not open');
            console.log('PASS: desktop hero, mobile hero, ID/EN, hamburger, Ask BIMA');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/phase1.js
