name: Fix BIMA chat formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bima-chat-formatting.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject safe BIMA markdown formatter
        env:
          BIMA_FORMATTER_B64: 
        run: |
          python -c "import os,base64,pathlib; p=pathlib.Path('index.html'); h=p.read_text(encoding='utf-8'); m='<!-- BIMA_CHAT_FORMATTER_V1 -->'; s=base64.b64decode(os.environ['BIMA_FORMATTER_B64']).decode(); assert '</body>' in h, 'Safety stop: </body> not found'; p.write_text(h if m in h else h.replace('</body>',s+'\n</body>',1),encoding='utf-8')"
      - name: Commit frontend patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Render BIMA bold markdown safely"
          git push
