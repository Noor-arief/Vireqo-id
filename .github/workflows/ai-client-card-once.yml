name: AI Client Card Once

on:
  push:
    branches:
      - ai-client-assistant-card

permissions:
  contents: write

jobs:
  patch-card:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-client-assistant-card
      - name: Apply isolated product card patch
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Verify isolated scope
        shell: bash
        run: |
          set -e
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q 'Vireqo AI Client Assistant' index.html
          grep -q 'id="ai-client-card-presentation"' index.html
          grep -q 'data-i18n="t145">Baru' index.html
          grep -q 'data-i18n="t146">Sangat Direkomendasikan' index.html
          grep -q '"t145": "New"' index.html
          grep -q '"t146": "Highly Recommended"' index.html
      - name: Commit product card patch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace SDM card with AI Client Assistant"
          git push origin HEAD:ai-client-assistant-card
