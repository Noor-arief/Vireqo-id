name: Restore Approved Hero
on:
  push:
    branches: [step3-restore-approved-index4]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact approved Hero lock
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8-sig')
          approved='''<style id="issue123-step3-final-lock">
          /* STEP 3 FINAL: approved hero only; runtime/other sections preserved. */
          @media (min-width:961px){
            .hero{padding:28px 0 0!important;overflow:hidden!important}
            .hero>.wrap,.hero .wrap{display:grid!important;grid-template-columns:minmax(0,48%) minmax(0,52%)!important;gap:30px!important;align-items:center!important;padding-bottom:30px!important}
            .hero>.wrap>div:first-of-type{min-width:0!important}
            .hero .badge{display:none!important}
            .hero h1{font-size:clamp(38px,3.25vw,50px)!important;line-height:1.06!important;letter-spacing:-1.3px!important;margin:0 0 14px!important;max-width:640px!important}
            .hero p{font-size:15.5px!important;line-height:1.48!important;max-width:620px!important;margin-bottom:15px!important}
            .hero-vp{gap:5px!important;margin-bottom:17px!important}
            .hero-vp span{font-size:13px!important}
            .hero-cta{gap:10px!important}
            .hero-visual.issue123-approved-hero{min-width:0!important;width:100%!important;margin:0!important;transform:none!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important}
            .hero-visual.issue123-approved-hero img{display:block!important;width:100%!important;height:auto!important;max-width:100%!important;object-fit:contain!important}
          }
          @media (min-width:1180px) and (max-height:820px){
            .hero{padding-top:14px!important}.hero h1{font-size:clamp(36px,2.75vw,46px)!important}.hero p{font-size:14.5px!important;line-height:1.4!important}.hero-vp{margin-bottom:12px!important}.hero>.wrap,.hero .wrap{padding-bottom:18px!important}
          }
          @media(max-width:960px){
            .hero>.wrap,.hero .wrap{grid-template-columns:1fr!important}.hero h1{font-size:clamp(34px,8vw,48px)!important}.hero-visual.issue123-approved-hero{transform:none!important;margin:28px 0 0!important;width:100%!important}.hero-visual.issue123-approved-hero img{width:100%!important;height:auto!important;display:block!important}
          }
          </style>'''
          # Remove our two broken overrides and any prior final-lock, then insert exact approved lock before </head>.
          for sid in ['issue123-final-approved-hero','issue123-step3-final-lock']:
              s=re.sub(r'<style id="'+re.escape(sid)+r'">.*?</style>\s*','',s,flags=re.S)
          pos=s.lower().rfind('</head>')
          if pos<0: raise SystemExit('head close missing')
          s=s[:pos]+approved+'\n'+s[pos:]
          guards=['issue123-approved-hero','heroH1','hamburgerBtn','mobileMenu','bimaFab','data-i18n']
          missing=[x for x in guards if x not in s]
          if missing: raise SystemExit('guard missing: '+','.join(missing))
          p.write_text(s,encoding='utf-8',newline='')
      - name: Commit exact approved Hero restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: restore exact approved Step 3 hero lock"
          git push
