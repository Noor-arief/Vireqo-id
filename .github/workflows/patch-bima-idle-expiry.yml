name: Patch BIMA idle expiry
on:
  push:
    branches:
      - fix-bima-idle-session-expiry
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix BIMA idle session expiry after suspended tabs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old="""  function scheduleIdleFlow(){
    clearIdleTimers();
    if(!sessionId||sessionClosed||handoverFollowup)return;
    idleReminderTimer=setTimeout(async function(){
      try{var data=await postSessionEvent('idle_reminder');if(data&&data.message)addMessage('assistant',data.message);}catch(error){console.error('BIMA idle reminder error:',error);}
      autoCloseTimer=setTimeout(async function(){
        try{var data=await postSessionEvent('close_inactive');if(data&&data.message)addMessage('assistant',data.message);markSessionClosed();}catch(error){console.error('BIMA auto-close error:',error);}
      },AUTO_CLOSE_MS);
    },IDLE_REMINDER_MS);
  }"""
          new="""  var IDLE_DEADLINE_KEY='vireqo_bima_idle_deadline';
  function expireInactiveSession(){
    if(!sessionId||sessionClosed||handoverFollowup)return;
    clearIdleTimers();
    sessionStorage.removeItem(IDLE_DEADLINE_KEY);
    postSessionEvent('close_inactive').then(function(data){
      if(data&&data.message)addMessage('assistant',data.message);
      markSessionClosed();
    }).catch(function(error){
      console.error('BIMA auto-close error:',error);
      markSessionClosed();
    });
  }
  function scheduleIdleFlow(){
    clearIdleTimers();
    if(!sessionId||sessionClosed||handoverFollowup)return;
    var deadline=Date.now()+IDLE_REMINDER_MS+AUTO_CLOSE_MS;
    sessionStorage.setItem(IDLE_DEADLINE_KEY,String(deadline));
    idleReminderTimer=setTimeout(async function(){
      try{var data=await postSessionEvent('idle_reminder');if(data&&data.message)addMessage('assistant',data.message);}catch(error){console.error('BIMA idle reminder error:',error);}
      autoCloseTimer=setTimeout(expireInactiveSession,AUTO_CLOSE_MS);
    },IDLE_REMINDER_MS);
  }
  function enforceIdleDeadline(){
    if(!sessionId||sessionClosed||handoverFollowup)return;
    var deadline=Number(sessionStorage.getItem(IDLE_DEADLINE_KEY)||0);
    if(deadline&&Date.now()>=deadline)expireInactiveSession();
  }
  document.addEventListener('visibilitychange',function(){if(!document.hidden)enforceIdleDeadline();});
  window.addEventListener('focus',enforceIdleDeadline);
  window.addEventListener('pageshow',enforceIdleDeadline);"""
          if old not in s: raise SystemExit("target scheduleIdleFlow not found")
          p.write_text(s.replace(old,new,1).replace("sessionStorage.removeItem(NAME_KEY);","sessionStorage.removeItem(NAME_KEY);\n    sessionStorage.removeItem(IDLE_DEADLINE_KEY);",1))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix BIMA idle session expiry after suspended tabs"
          git push
