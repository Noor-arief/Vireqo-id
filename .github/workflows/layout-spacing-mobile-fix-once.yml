name: Layout Spacing Mobile Fix Once

on:
  push:
    branches:
      - layout-spacing-mobile-fix

permissions:
  contents: write

jobs:
  patch-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: layout-spacing-mobile-fix
      - name: Apply targeted CSS only
        shell: bash
        run: |
          python3 -c "import base64; from pathlib import Path; p=Path('index.html'); h=p.read_text(encoding='utf-8'); m='<style id=\"layout-spacing-mobile-fix\">'; assert m not in h; css=base64.b64decode('').decode(); assert '</head>' in h; p.write_text(h.replace('</head>', css+'</head>', 1), encoding='utf-8')"
      - name: Verify scope
        shell: bash
        run: |
          set -e
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "index.html"
          grep -q 'id="layout-spacing-mobile-fix"' index.html
      - name: Commit targeted patch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix desktop spacing and mobile checklist width"
          git push origin HEAD:layout-spacing-mobile-fix
