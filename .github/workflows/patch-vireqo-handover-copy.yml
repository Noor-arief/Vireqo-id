name: Patch Vireqo handover copy
on:
  push:
    branches: [fix-vireqo-customer-facing-handover-copy]
    paths: ['.github/workflows/patch-vireqo-handover-copy.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer-facing terminology and output guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            'kapan percakapan perlu diteruskan ke tim manusia.':'kapan percakapan perlu diteruskan ke tim Vireqo.',
            'when conversations should be handed over to your human team.':'when conversations should be handed over to the Vireqo team.'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected copy: {old}')
              s=s.replace(old,new)
          # Final customer-facing guard: generated replies must not expose awkward AI-vs-human wording.
          needle="function addMsg(text,who){"
          if needle not in s:
              raise SystemExit('addMsg hook not found')
          guard="function normalizeVireqoCustomerCopy(text){return String(text==null?'':text).replace(/tim manusia/gi,'tim Vireqo').replace(/human team/gi,'Vireqo team').replace(/tim human/gi,'tim Vireqo').replace(/manusia Vireqo/gi,'tim Vireqo');}\n  "
          if 'function normalizeVireqoCustomerCopy' not in s:
              s=s.replace(needle,guard+needle,1)
          # Normalize only BIMA/server text at render boundary; user messages remain untouched.
          old="function addMsg(text,who){"
          new="function addMsg(text,who){if(who!=='user')text=normalizeVireqoCustomerCopy(text);"
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          grep -q "diteruskan ke tim Vireqo" index.html
          grep -q "handed over to the Vireqo team" index.html
          grep -q "normalizeVireqoCustomerCopy" index.html
          if grep -F "kapan percakapan perlu diteruskan ke tim manusia." index.html; then exit 1; fi
          if grep -F "handed over to your human team." index.html; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Vireqo customer-facing handover terminology"
          git push
