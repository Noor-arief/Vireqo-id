name: Patch Vireqo handover copy
on:
  push:
    branches: [fix-vireqo-customer-facing-handover-copy]
    paths: ['.github/workflows/patch-vireqo-handover-copy.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer-facing terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            'kapan percakapan perlu diteruskan ke tim manusia.':'kapan percakapan perlu diteruskan ke tim Vireqo.',
            'when conversations should be handed over to your human team.':'when conversations should be handed over to the Vireqo team.'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected copy: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          grep -q "diteruskan ke tim Vireqo" index.html
          grep -q "handed over to the Vireqo team" index.html
          if grep -F "kapan percakapan perlu diteruskan ke tim manusia." index.html; then exit 1; fi
          if grep -F "handed over to your human team." index.html; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Vireqo customer-facing handover terminology"
          git push
